<!doctype html>
<html lang="en">
<head>

  <link rel="stylesheet" href="overlay.css?v=4.3">
</head>
<body>

      </div>

      <div class="perk-slot">

      <div class="perk-slot">

          <img class="perk-image" alt="">
        </div>
        <div class="perk-name"></div>
      </div>

      <div class="perk-slot">
        <div class="reel-window">
          <img class="perk-image" alt="">
        </div>
        <div class="perk-name"></div>
      </div>
    </div>

    <div id="perkele-footer" class="perkele-footer"></div>
    <div class="perkele-credit">PapaThorSwe</div>
  </main>

  <script src="overlay.js?v=4.3"></script>
